name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Check only the Windows installer'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build and playback dependencies
        run: |
          brew install mpv deno python@3.14
          rustup update stable --no-self-update
          npm ci
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('package.json'))['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match app version'
          assert json.load(open('src-tauri/tauri.conf.json'))['version'] == version
          PY
      - name: Run Rust checks
        run: npm test
      - name: Prepare self-contained runtime and corresponding sources
        run: |
          python3 scripts/prepare-runtime.py --check
          npm run release:prepare
      - name: Build installer
        run: npm run release:build
      - name: Verify packaged dependencies and signatures
        run: |
          python3 scripts/check-runtime.py 'src-tauri/target/release/bundle/macos/Lofi Radio.app/Contents/Resources/runtime'
          codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/Lofi Radio.app'
          hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg
      - name: Collect release files
        run: |
          mkdir release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
          for file in release-assets/*.dmg; do mv "$file" "${file// /-}"; done
          cp src-tauri/target/third-party-sources.tar.gz 'release-assets/third-party-sources-${{ matrix.arch }}.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
      - name: Install frontend dependencies and check version
        shell: pwsh
        run: |
          npm ci
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match app version' }
          }
      - name: Check Windows player and settings
        run: npm test
      - name: Prepare bundled tools, licenses and corresponding sources
        shell: pwsh
        run: |
          python scripts/prepare-runtime-windows.py --check
          python scripts/prepare-runtime-windows.py --msys-root "${{ steps.msys.outputs.msys2-location }}"
      - name: Build installer and check packaged player
        shell: pwsh
        run: |
          npm run tauri -- build --config src-tauri/tauri.windows.release.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = Get-ChildItem src-tauri/target/debug/deps/lofi_radio_lib-*.exe | Select-Object -First 1
          python scripts/check-runtime-windows.py src-tauri/runtime --test-executable $tests.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install silently and check installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Lofi Radio installed'
          $process = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $app = Join-Path $installDir 'lofi-radio.exe'
          if (!(Test-Path $app)) { throw 'Installed app missing' }
          $tests = Get-ChildItem src-tauri/target/debug/deps/lofi_radio_lib-*.exe | Select-Object -First 1
          python scripts/check-runtime-windows.py "$installDir/runtime" --test-executable $tests.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Installed app exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - name: Collect Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            Copy-Item $_.FullName (Join-Path release-assets ($_.Name -replace ' ', '-'))
          }
          Copy-Item src-tauri/target/third-party-sources-windows-x64.tar.gz release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish installers and source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.dmg *.exe *.tar.gz > SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --title "Lofi Radio $GITHUB_REF_NAME" --notes-file ../.github/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
