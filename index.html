<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lofi Radio</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main>
      <header><button id="hide" class="quiet" aria-label="收起到菜单栏" title="收起到菜单栏">⌃</button></header>
      <section class="station" aria-label="当前电台">
        <div class="station-icon"><img src="/assets/lofi-wordmark-sage.png" alt="lofi" width="88" height="44" /></div>
        <div id="station-name" class="station-name">Lofi Girl · 学习</div>
      </section>
      <div class="source-row">
        <label for="station">直播源</label>
        <select id="station" aria-describedby="station-hint" disabled></select>
        <span id="station-hint">选择后立即播放</span>
      </div>
      <p id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">待播放</span></p>
      <button id="play" class="play"><span id="play-icon" aria-hidden="true">▶</span><span id="play-text">播放</span></button>
      <div class="volume-row"><label for="volume">音量</label><output id="volume-value" for="volume">30%</output></div>
      <input id="volume" type="range" min="0" max="100" step="1" value="30" aria-label="音量" />
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
